name: review-platform

services:
  clamav:
    image: clamav/clamav:1.4.6@sha256:c3bfbf2a2c9abc1fc179e63832a9e8bfac901ede83853e3fa10acf6f1fb5c803
    platform: linux/amd64
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 360s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-review_platform}
      POSTGRES_USER: ${POSTGRES_USER:-review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-review}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review_platform"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      APP_ENV: development
      APP_LOG_LEVEL: INFO
      APP_SECURITY_HEADERS_ENABLED: "true"
      APP_METRICS_ENABLED: "true"
      APP_RATE_LIMIT_ENABLED: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-review}:${POSTGRES_PASSWORD:-review}@db:5432/${POSTGRES_DB:-review_platform}
      DATABASE_REQUIRE_MIGRATIONS: "true"
      DATABASE_EXPECTED_REVISION: "20260820_0037"
      AI_PROVIDER: mock
      OBJECT_STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/data/objects
      MALWARE_SCANNER_PROVIDER: clamav
      MALWARE_SCANNER_HOST: clamav
      MALWARE_SCANNER_PORT: "3310"
      MALWARE_SCANNER_TIMEOUT_SECONDS: "30"
      MAX_MALWARE_SCAN_ATTEMPTS: "3"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    ports:
      - "8000:8000"
    volumes:
      - object_data:/app/data/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "workers.review_worker"]
    environment: *backend-environment
    volumes:
      - object_data:/app/data/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; raise SystemExit(0 if 'workers.review_worker' in Path('/proc/1/cmdline').read_bytes().decode(errors='ignore') else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_BASE_URL: http://backend:8000
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  clamav_data:
  postgres_data:
  object_data:
